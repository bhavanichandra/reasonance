spring:
  application:
    name: reasonance
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/reasonance_db
    username: reasonance_user
    password: reasonance_password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  web:
    error:
      include-message: always
  ai:
    ollama:
      base-url: http://localhost:11434s
      chat:
        model: gemma3n
        options:
          format: json
    model:
      chat: ollama


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

rustfs:
  url: http://localhost:9000
  bucket: reasonance_files
  access_key_id: reasonance_admin
  access_secret_key: reasonance_admin

app:
  llm:
    provider: ollama

gemini:
  api-key:
  model: gemini-3-pro-preview
logging:
  level:
    com.themuler.reasonance: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always