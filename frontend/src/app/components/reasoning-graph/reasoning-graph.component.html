<div class="w-full h-full bg-slate-950 flex flex-col overflow-hidden rounded-xl">
  <!-- Controls Panel -->
  @if (showHeader()) {
    <div
      #controlsPanel
      class="bg-gradient-to-r from-slate-800 to-slate-900 border-b border-slate-700 p-6"
    >
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div>
          <h2 class="text-xl font-bold text-white mb-1">Reasoning Graph</h2>
          <p class="text-slate-400 text-sm">
            💡 Drag to rotate • Scroll to zoom • Click nodes for details
          </p>
        </div>
        <p-button
          label="Refresh Graph"
          icon="pi pi-refresh"
          [loading]="loading()"
          (click)="loadGraphData()"
          class="text-white border-0"
        ></p-button>
      </div>
    </div>
  }

  <!-- Graph Container -->
  <div #graphContainer class="flex-1 w-full bg-slate-950"></div>
</div>
