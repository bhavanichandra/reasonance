<div #whatIfElement class="relative w-80">
  <div class="absolute -top-2 left-5 w-3 h-3 rounded-full bg-red-400 shadow"></div>
  <div class="bg-amber-100/90 border border-amber-200 rounded-t-md px-3 py-2 text-[10px] uppercase tracking-[0.3em] font-black text-amber-900">
    Exploratory Hypothesis
  </div>
  <div
    class="bg-cyan-100/90 border-x border-b border-cyan-200 rounded-b-md px-3 py-3 shadow-[0_12px_24px_rgba(0,0,0,0.25)] rotate-[1deg] bg-[linear-gradient(to_bottom,rgba(255,255,255,0)_0px,rgba(255,255,255,0)_12px,rgba(60,130,200,0.2)_12px,rgba(60,130,200,0.2)_13px)] bg-[length:100%_18px]"
  >
    <div class="flex items-center justify-between gap-2 mb-2">
      <p class="text-xs font-semibold text-cyan-900">One explanatory model</p>
      <p-button
        (click)="toggleView()"
        [title]="showSummary() ? 'Show full model' : 'Show summary'"
        class="text-cyan-700 hover:text-cyan-900 transition-opacity p-0.5"
        [text]="true"
        [rounded]="true"
      >
        <ng-icon
          name="phosphorCaretDown"
          [class]="['text-base', !showSummary() ? 'rotate-180' : '']"
        ></ng-icon>
      </p-button>
    </div>

    <div class="text-xs leading-relaxed max-h-28 overflow-y-auto text-cyan-800">
      @if (showSummary() && node().summary) {
        <p class="font-semibold text-cyan-900">{{ node().summary }}</p>
      } @else {
        <p>{{ node().content }}</p>
      }
    </div>
  </div>
</div>
